# Default values for banking-app.
# Anything here can be overridden with -f a-values-file.yaml or --set key=value.

namespace: banking

image:
  registry: docker.io/akhilmittal510   # e.g. docker.io/amit2308
  pullPolicy: IfNotPresent

# ── Blue-green control ──
# activeSlot decides which set of pods the STABLE Service (the one Ingress
# and other services actually talk to) routes traffic to. Flipping this and
# running `helm upgrade` is the entire cutover step — no pods are touched,
# only the Service selector changes.
activeSlot: blue   # blue | green

# Each microservice gets its own independent image tag PER SLOT, so you can
# run v12 on blue (serving prod traffic) while v13 is deployed to green for
# testing, entirely independently of which slot is currently active.
services:
  account:
    port: 8081
    replicas: 1
    blueTag: "stable"
    greenTag: "stable"
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }
  auth:
    port: 8082
    replicas: 1
    blueTag: "stable"
    greenTag: "stable"
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }
  transaction:
    port: 8083
    replicas: 1
    blueTag: "stable"
    greenTag: "stable"
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }

mysql:
  image: mariadb:10.9
  rootPasswordSecretName: mysql-secret
  rootPasswordSecretKey: root-password

  # ── External Secrets Operator config ──
  # No `rootPassword` field here anymore, deliberately — the password now
  # lives ONLY in AWS Secrets Manager. See templates/secret-and-serviceaccount.yaml.
  externalSecret:
    enabled: true
    clusterSecretStoreName: aws-secrets-manager
    secretsManagerKey: banking/mysql/root-password   # the actual secret name in Secrets Manager
    refreshInterval: 1h

  # ── Storage ──
  storage: 5Gi
  storageClassName: banking-mysql-gp3
  createStorageClass: true   # set false if your cluster already has a suitable default StorageClass

ingress:
  enabled: true
  className: nginx
  host: demoprojectbc1.com

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
