# NOTE: for a real production chart, don't put the secret value in
# values.yaml or --set it in plain text on the command line (it ends up in
# `helm history`/shell history). Pass it via --set-file, an external secrets
# operator, or create this Secret out-of-band and just reference its name
# (which is what rootPasswordSecretName above already does) — this template
# is included so the chart is fully self-contained for the lab, with that
# caveat called out explicitly in the session doc.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mysql.rootPasswordSecretName }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  {{ .Values.mysql.rootPasswordSecretKey }}: {{ .Values.mysql.rootPassword | default "changeme-set-via---set" | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-service-account
  namespace: {{ .Values.namespace }}
