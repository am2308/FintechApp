# The MySQL root password is now owned entirely by AWS Secrets Manager via
# External Secrets Operator (ESO) — NOT by values.yaml or --set. This is
# what makes the "Secret says one password, MySQL's data dir has another"
# class of bug structurally impossible going forward: there's exactly one
# place the password is ever written (Secrets Manager), and this
# ExternalSecret just mirrors it into a normal K8s Secret with the SAME
# name/key the StatefulSet and app Deployments already reference — so
# mysql-statefulset.yaml and deployment.yaml needed ZERO changes for this.
#
# Prerequisites this depends on (one-time, cluster-level, not part of this
# chart — see the session doc's "one-time setup" section):
#   1. External Secrets Operator installed in the cluster
#   2. A ClusterSecretStore named `aws-secrets-manager` already created,
#      backed by an IRSA role with secretsmanager:GetSecretValue on the
#      specific secret ARN below
#   3. The secret itself already created in AWS Secrets Manager
{{- if .Values.mysql.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.mysql.rootPasswordSecretName }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.mysql.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.mysql.externalSecret.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.mysql.rootPasswordSecretName }}   # ← same Secret name the StatefulSet/Deployments already use
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.mysql.rootPasswordSecretKey }}   # ← same key they already use
      remoteRef:
        key: {{ .Values.mysql.externalSecret.secretsManagerKey }}
        property: {{ .Values.mysql.rootPasswordSecretKey }}
{{- else }}
# Fallback path — only used if you explicitly set mysql.externalSecret.enabled=false
# (e.g. a throwaway local kind/minikube lab with no AWS account at all).
# Uses the Helm `lookup` trick so a value already in the cluster is reused
# rather than regenerated on every upgrade, and a genuinely fresh install
# gets a strong random password instead of a hardcoded placeholder.
{{- $existingSecret := lookup "v1" "Secret" .Values.namespace .Values.mysql.rootPasswordSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mysql.rootPasswordSecretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep   # survives `helm uninstall` — the PVC's already-initialized password does too
type: Opaque
data:
  {{ .Values.mysql.rootPasswordSecretKey }}: {{ if $existingSecret }}{{ index $existingSecret.data .Values.mysql.rootPasswordSecretKey }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-service-account
  namespace: {{ .Values.namespace }}
